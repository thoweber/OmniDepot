name: omnidepot 3x3 E2E Matrix Validation (Disabled)

# Disabled for automated Push/PR runs - reserved for future manual/scheduled E2E matrix testing
on:
  workflow_dispatch:

# Future automated triggers:
# on:
#   push:
#     branches: [ main ]
#   pull_request:
#     branches: [ main ]

jobs:
  e2e-matrix-test:
    name: Format (${{ matrix.format }}) x Topology (${{ matrix.topology }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        format: ['docker', 'mvn', 'npm']
        topology: ['single-container', 'multi-node', 'dev-zero-auth']

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start Infrastructure Containers
        run: |
          docker compose up -d postgres rustfs
          docker compose exec -T postgres pg_isready -U omnidepot -d omnidepot || sleep 5

      - name: Build omnidepot Modular Monolith
        run: |
          ./mvnw clean package -DskipTests

      - name: Execute 3x3 Matrix E2E Test Suite
        env:
          TEST_FORMAT: ${{ matrix.format }}
          TEST_TOPOLOGY: ${{ matrix.topology }}
        run: |
          ./mvnw test -Dformat=${{ matrix.format }} -Dtopology=${{ matrix.topology }}
