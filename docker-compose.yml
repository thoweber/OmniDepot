version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: omnidepot-postgres
    environment:
      POSTGRES_DB: omnidepot
      POSTGRES_USER: omnidepot
      POSTGRES_PASSWORD: omnidepot_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnidepot -d omnidepot"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: omnidepot-rustfs
    environment:
      RUSTFS_ACCESS_KEY: omnidepot_rustfs
      RUSTFS_SECRET_KEY: omnidepot_rustfs_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: omnidepot-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./docker/caddy/certs:/etc/caddy/certs
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - postgres

volumes:
  postgres_data:
  rustfs_data:
  caddy_data:
  caddy_config:
