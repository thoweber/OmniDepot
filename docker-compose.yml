version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnidepot-postgres
    environment:
      POSTGRES_DB: omnidepot
      POSTGRES_USER: omnidepot
      POSTGRES_PASSWORD: omnidepot_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnidepot -d omnidepot"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: omnidepot-minio
    environment:
      MINIO_ROOT_USER: omnidepot_minio
      MINIO_ROOT_PASSWORD: omnidepot_minio_secret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: omnidepot-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./docker/caddy/certs:/etc/caddy/certs
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - postgres

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
