# omnidepot Quarkus Master Configuration

# Server Ports (ADR-004 & ADR-010)
quarkus.http.port=8080
quarkus.management.enabled=true
quarkus.management.port=9000
quarkus.management.root-path=/q

# Database & Liquibase (ADR-023)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:omnidepot;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

# Storage Provider Configuration (ADR-003)
repo.storage.type=fs
repo.storage.fs.root-dir=./data/blobs

# IAM & Security (ADR-021)
repo.auth.mode=disabled

# Proxy Cache Revalidation TTL (ADR-027)
repo.proxy.revalidation-ttl=60s
