site_name: omnidepot Documentation
site_description: Polyglot Package Repository (OCI, Maven, NPM) - Evolutionary Modular Monolith
site_author: omnidepot Team
repo_name: omnidepot
repo_url: https://github.com/omnidepot/omnidepot

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.def_mermaid_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - User Documentation:
      - Overview: user-guide/index.md
      - Getting Started: user-guide/getting-started.md
      - OCI Distribution Registry: user-guide/oci-distribution.md
      - Maven / Gradle Repository: user-guide/maven-repository.md
